[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "invoicetosheet"
version = "1.4.1"
description = "Microservicio de extracción contable inteligente y consolidación en hojas de cálculo Excel."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Heidy Flores", email = "heidyflores@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Operating System :: OS Independent"
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pdfplumber>=0.11.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.1",
    "sentry-sdk[fastapi]>=2.0.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "alembic>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["extractor*"]
exclude = ["static*", "facturas_ejemplo*", "tests*"]

[tool.setuptools]
py-modules = ["main", "schemas", "database", "excel_generator", "observability", "config"]


# -------------------------------------------------------------
# Configuración de Pytest
# -------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: mark test as integration test requiring external binaries like tesseract or poppler",
]
addopts = "-v --strict-markers -m 'not integration' --cov=. --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

# -------------------------------------------------------------
# Configuración de Cobertura de Código (Coverage.py)
# -------------------------------------------------------------
[tool.coverage.run]
source = ["."]
omit = [
    "venv/*",
    "tests/*",
    "test_pipeline.py",
    "generate_sample_pdf.py",
    "setup.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "pass"
]
show_missing = true
fail_under = 80


# -------------------------------------------------------------
# Configuración del Linter y Formateador Ruff
# -------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist"
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM"  # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends/File)
    "UP007"  # Use X | Y for type annotations
]

[tool.ruff.lint.isort]
known-first-party = ["schemas", "extractor", "excel_generator", "observability", "main"]

# -------------------------------------------------------------
# Configuración del Verificador de Tipos Mypy
# -------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["venv", "build", "dist"]
